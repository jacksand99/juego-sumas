<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafío de Sumas Matemáticas (Vertical)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .stats-panel {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.95em;
        }
        .stat-item {
            font-weight: bold;
        }
        .cronometro {
            grid-column: span 2;
            font-size: 1.2em;
            color: #d9534f;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
            margin-bottom: 5px;
        }
        .aciertos { color: #28a745; }
        .fallos { color: #dc3545; }
        .puntuacion { color: #007bff; grid-column: span 2; font-size: 1.1em; margin-top: 5px;}
        
        .operacion-box {
            font-family: 'Courier New', Courier, monospace;
            font-size: 2.5em;
            font-weight: bold;
            margin: 25px auto;
            color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            width: fit-content;
            padding: 15px 30px;
            background-color: #fafafa;
            border-radius: 8px;
            border: 1px solid #e1e4e6;
        }
        .linea-suma {
            width: 120%;
            border-bottom: 4px solid #2c3e50;
            margin: 5px 0;
            align-self: center;
        }
        .numero-operando {
            position: relative;
            width: 100%;
            text-align: right;
        }
        .signo-mas {
            position: absolute;
            left: -25px;
        }

        .btn-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 25px;
        }
        button {
            padding: 12px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            width: 130px;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-correcto {
            background-color: #28a745;
            color: white;
        }
        .btn-correcto:hover { background-color: #218838; }
        .btn-incorrecto {
            background-color: #dc3545;
            color: white;
        }
        .btn-incorrecto:hover { background-color: #c82333; }
        .btn-reiniciar {
            background-color: #007bff;
            color: white;
            width: auto;
            margin-top: 20px;
        }
        .btn-reiniciar:hover { background-color: #0069d9; }
        .oculto { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Desafío de Sumas</h1>
        
        <div class="stats-panel">
            <div id="cronometro" class="stat-item cronometro">Tiempo: 00:00</div>
            <div class="stat-item">Progreso: <span id="progreso">1</span> / 100</div>
            <div class="stat-item aciertos">Aciertos: <span id="aciertos">0</span></div>
            <div class="stat-item fallos">Fallos: <span id="fallos">0</span></div>
            <div id="puntuacion-box" class="stat-item puntuacion">Puntuación Total: <span id="puntuacion">0</span></div>
        </div>

        <div id="juego-seccion">
            <div class="operacion-box">
                <div id="num1">---</div>
                <div id="num2">---</div>
                <div class="numero-operando"><span class="signo-mas">+</span><span id="txt-num3">---</span></div>
                <div class="linea-suma"></div>
                <div id="resultado">---</div>
            </div>
            
            <div class="btn-container">
                <!-- Se añade directamente el evento "onclick" para evitar fallos de enlace en el script -->
                <button class="btn-correcto" onclick="comprobarRespuesta(true)">Correcto</button>
                <button class="btn-incorrecto" onclick="comprobarRespuesta(false)">Incorrecto</button>
            </div>
        </div>

        <div id="fin-seccion" class="oculto">
            <h2>¡Juego Terminado!</h2>
            <p>Has completado las 100 operaciones.</p>
            <button class="btn-reiniciar" onclick="iniciarJuego()">Jugar de nuevo</button>
        </div>
    </div>

    <!-- El Script se coloca justo antes del cierre de body sin depender de eventos de carga -->
    <script>
        const TOTAL_SUMAS = 100;
        let numeroSumaActual = 0;
        let aciertos = 0;
        let fallos = 0;
        let resultadoCorrectoActual = 0;
        let resultadoMostradoActual = 0;
        let tiempoSegundos = 0;
        let intervaloCronometro = null;

        // Referencias directas globales
        const elCronometro = document.getElementById('cronometro');
        const elProgreso = document.getElementById('progreso');
        const elAciertos = document.getElementById('aciertos');
        const elFallos = document.getElementById('fallos');
        const elPuntuacion = document.getElementById('puntuacion');
        const elNum1 = document.getElementById('num1');
        const elNum2 = document.getElementById('num2');
        const elTxtNum3 = document.getElementById('txt-num3');
        const elResultado = document.getElementById('resultado');
        const elJuegoSeccion = document.getElementById('juego-seccion');
        const elFinSeccion = document.getElementById('fin-seccion');

        function generarNumero3Cifras() {
            return Math.floor(Math.random() * 900) + 100;
        }

        function iniciarJuego() {
            numeroSumaActual = 0;
            aciertos = 0;
            fallos = 0;
            tiempoSegundos = 0;
            
            actualizarMarcador();
            
            elJuegoSeccion.classList.remove('oculto');
            elFinSeccion.classList.add('oculto');
            
            clearInterval(intervaloCronometro);
            elCronometro.textContent = "Tiempo: 00:00";
            intervaloCronometro = setInterval(actualizarCronometro, 1000);
            
            siguienteSuma();
        }

        function actualizarCronometro() {
            tiempoSegundos++;
            let minutos = Math.floor(tiempoSegundos / 60);
            let segundos = tiempoSegundos % 60;
            
            let minStr = minutos < 10 ? '0' + minutos : minutos;
            let segStr = segundos < 10 ? '0' + segundos : segundos;
            
            elCronometro.textContent = `Tiempo: ${minStr}:${segStr}`;
        }

        function siguienteSuma() {
            numeroSumaActual++;
            if (numeroSumaActual > TOTAL_SUMAS) {
                finalizarJuego();
                return;
            }

            elProgreso.textContent = numeroSumaActual;

            let num1 = generarNumero3Cifras();
            let num2 = generarNumero3Cifras();
            let num3 = generarNumero3Cifras();

            resultadoCorrectoActual = num1 + num2 + num3;

            let mostrarCorrecto = Math.random() < 0.5;

            if (mostrarCorrecto) {
                resultadoMostradoActual = resultadoCorrectoActual;
            } else {
                let desfase = 0;
                while (desfase === 0) {
                    desfase = Math.floor(Math.random() * 61) - 30;
                }
                resultadoMostradoActual = resultadoCorrectoActual + desfase;
            }

            elNum1.textContent = num1;
            elNum2.textContent = num2;
            elTxtNum3.textContent = num3;
            elResultado.textContent = resultadoMostradoActual;
        }

        function comprobarRespuesta(usuarioDiceCorrecto) {
            let esRealmenteCorrecto = (resultadoCorrectoActual === resultadoMostradoActual);

            if (usuarioDiceCorrecto === esRealmenteCorrecto) {
                aciertos++;
            } else {
                fallos++;
            }

            actualizarMarcador();
            siguienteSuma();
        }

        function actualizarMarcador() {
            elAciertos.textContent = aciertos;
            elFallos.textContent = fallos;
            elPuntuacion.textContent = aciertos - fallos;
        }

        function finalizarJuego() {
            clearInterval(intervaloCronometro);
            elJuegoSeccion.classList.add('oculto');
            elFinSeccion.classList.remove('oculto');
        }

        // Ejecución inmediata al leer el script
        iniciarJuego();
    </script>
</body>
</html>
